name: Paper discovery loop

on:
  schedule:
    # Mondays at 10:23 KST (GitHub Actions cron uses UTC).
    - cron: "23 1 * * 1"
  workflow_dispatch:

concurrency:
  group: paper-discovery-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover-and-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run offline unit and fixture tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile build.py scripts/paper_loop.py

      - name: Verify the survey build
        run: python build.py

      - name: Discover and classify recent papers
        run: python scripts/paper_loop.py run

      - name: Create or update the human-review pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            automation/**
          branch: automation/paper-discovery-loop
          delete-branch: true
          draft: always-true
          commit-message: "chore: update paper discovery queue"
          title: "chore: review newly discovered survey papers"
          body: |
            This draft PR was generated by the scheduled paper discovery loop.

            Before merging:
            - open `automation/inbox/latest.md` and verify every candidate against the paper;
            - treat heuristic results as unverified when no Anthropic API key was available;
            - check full text, venue, metrics, links, and the proposed survey section;
            - move approved material into `content/` in a separate reviewed edit.

            The automation deliberately never edits the published survey tables.
