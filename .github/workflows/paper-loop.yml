name: Paper discovery loop

on:
  workflow_dispatch:

concurrency:
  group: paper-discovery-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover-and-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run offline unit and fixture tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile build.py scripts/paper_loop.py

      - name: Verify the survey build
        run: python build.py

      - name: Restore the persistent automation queue
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin automation/paper-discovery-loop >/dev/null 2>&1; then
            git fetch --depth=1 origin automation/paper-discovery-loop
            git checkout FETCH_HEAD -- \
              automation/state.json \
              automation/runs \
              automation/inbox \
              automation/drafts
          fi

      - name: Discover and classify recent papers
        run: python scripts/paper_loop.py run --llm-provider deterministic

      - name: Create or update the human-review pull request
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            automation/**
          branch: automation/paper-discovery-loop
          delete-branch: true
          draft: always-true
          commit-message: "chore: update paper discovery queue"
          title: "chore: review newly discovered survey papers"
          body: |
            This draft PR was generated by a manually triggered deterministic recovery run.

            Before merging:
            - open `automation/inbox/latest.md` and verify every candidate against the paper;
            - treat every deterministic result as unverified and review it manually;
            - check full text, venue, metrics, links, and the proposed survey section;
            - move approved material into `content/` in a separate reviewed edit.

            The automation deliberately never edits the published survey tables.
